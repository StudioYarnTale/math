<!DOCTYPE html>
<html>
<head>
    <title>Математический Микроскоп — Прямая</title>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #eee; font-family: Arial, sans-serif; overflow: hidden; }
        canvas { background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); cursor: ew-resize; }
    </style>
</head>
<body>

<canvas id="microscope"></canvas>

<script>
    const canvas = document.getElementById('microscope');
    const ctx = canvas.getContext('2d');

    let width, height;
    let zoom; 
    let offset = { x: 0, y: 0 };
    let isDragging = false;
    let lastMouseX = 0;

    function init() {
        width = canvas.width = window.innerWidth * 0.95; 
        height = canvas.height = 200; 
        
        // Устанавливаем начальный масштаб, чтобы было видно от -5 до 5
        // Ширина / 10 (так как от -5 до 5 ровно 10 единиц)
        zoom = width / 11; 
        
        offset.x = width / 2;
        offset.y = height / 2;
        draw();
    }

    function getSuperscript(num) {
        const superscripts = {
            '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
            '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻'
        };
        return num.toString().split('').map(char => superscripts[char] || char).join('');
    }

    function formatLabel(num) {
        let absNum = Math.abs(num);
        if (absNum < 1e-12) return "0"; // Четкий ноль
        if (absNum < 0.0001 || absNum >= 10000) {
            let expParts = num.toExponential(0).split('e');
            let base = expParts[0];
            let exponent = parseInt(expParts[1]);
            return base + '·10' + getSuperscript(exponent);
        }
        return parseFloat(num.toFixed(10)).toString();
    }

function drawLines(step, isMajor) {
        let distanceOnScreen = step * zoom;
        let showLabelsNow = isMajor && (distanceOnScreen > 50);

        let startX = Math.floor(-offset.x / (step * zoom)) * step;
        let endX = Math.ceil((width - offset.x) / (step * zoom)) * step;

        ctx.beginPath();
        
        for (let x = startX; x <= endX; x += step) {
            let canvasX = x * zoom + offset.x;
            
            // Проверка на ноль с учетом погрешности плавающей точки
            let isZero = Math.abs(x) < 1e-15;
            
            if (isZero) {
                // Ноль — самый главный
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4; // Очень жирная метка
            } else {
                ctx.strokeStyle = isMajor ? "#4a6741" : "#cccccc";
                ctx.lineWidth = isMajor ? 2 : 1;
            }

            // Метка нуля длиннее всех (35px), major — 15px, minor — 8px
            let tickSize = isZero ? 35 : (isMajor ? 15 : 8);
            
            ctx.beginPath();
            ctx.moveTo(canvasX, offset.y - tickSize);
            ctx.lineTo(canvasX, offset.y + tickSize);
            ctx.stroke();
            
            // Условие отрисовки текста: либо это ноль (всегда), либо сработал порог расстояния
            if (isZero || showLabelsNow) {
                ctx.fillStyle = isZero ? "#000" : "#4a6741";
                ctx.font = isZero ? "bold 22px Arial" : "bold 16px Arial"; // Ноль крупнее
                ctx.textAlign = "center";
                
                // Для нуля рисуем подпись чуть выше, чтобы не перекрывать жирную метку
                let textYOffset = isZero ? tickSize + 15 : tickSize + 10;
                ctx.fillText(formatLabel(x), canvasX, offset.y - textYOffset);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        let stepPower = Math.floor(Math.log10(100 / zoom));
        let majorStep = Math.pow(10, stepPower);
        let minorStep = majorStep / 10;

        drawLines(minorStep, false);
        drawLines(majorStep, true);

        // Главная горизонтальная ось
        ctx.beginPath();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.moveTo(0, offset.y);
        ctx.lineTo(width, offset.y);
        ctx.stroke();

        requestAnimationFrame(draw);
    }

    // События мыши
    window.addEventListener('wheel', e => {
        e.preventDefault();
        const mouseX = e.clientX - canvas.getBoundingClientRect().left;
        
        // Инвертируем: дельта меньше 0 (вверх) -> увеличение (1.1)
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        
        const worldX = (mouseX - offset.x) / zoom;
        zoom *= zoomFactor;
        offset.x = mouseX - worldX * zoom;
    }, { passive: false });

    window.addEventListener('mousedown', e => {
        isDragging = true;
        lastMouseX = e.clientX;
    });

    window.addEventListener('mousemove', e => {
        if (isDragging) {
            offset.x += e.clientX - lastMouseX;
            lastMouseX = e.clientX;
        }
    });

    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('resize', init);

    init();
</script>

</body>
</html>
