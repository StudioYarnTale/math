<style>
	

table.trig{
    width:600px;
    margin:25px 0;
    font-size:1rem;
    border:3px solid #B8D6D5;
    border-radius:8px;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
}

table.trig th,table.trig td{
    padding:14px 12px;
    text-align:center;
    white-space:nowrap;
    border-right:1px solid #B8D6D5;
    border-bottom:1px solid #B8D6D5;
}

/* Верхняя строка */
table.trig thead th{background:#D1E8E6;font-weight:700;}
/* Левая колонка */
table.trig tbody th{background:#D1E8E6;font-weight:700;}

/* Чередование строк */
table.trig tbody tr:nth-child(odd) td{background:#E6F3F2;}
table.trig tbody tr:nth-child(even) td{background:#F9FDFD;}

/* Убираем лишние линии */
table.trig tr:last-child td,table.trig tr:last-child th{border-bottom:none;}
table.trig td:last-child,table.trig th:last-child{border-right:none;}
table.trig i{font-style:italic;}
</style>
